name: Build Hoolock Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git clang lld make flex bison libncurses-dev device-tree-compiler libssl-dev libelf-dev bc rsync xz-utils

      - name: Build Kernel
        run: |
          # 必须指定 ARCH=arm64，否则生成的是电脑 x86 的配置
          make ARCH=arm64 defconfig
          ./scripts/config --enable CONFIG_ARM64_16K_PAGES
          make ARCH=arm64 olddefconfig
          
          # 开始编译
          make -j$(nproc) LLVM=1 ARCH=arm64 Image.gz dtbs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoolock-kernel
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/apple/t8015-d20.dtb
